[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbasecouter-spatial"
version = "0.2.0"
description = "Build spatial expression records from verified SRAgent-spatial reports"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.11,<0.13",
    "h5py>=3.10",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10",
    "pyarrow>=15",
    "scipy>=1.12",
    "tifffile>=2024.8",
]

[project.scripts]
sbasecouter = "sbasecouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
